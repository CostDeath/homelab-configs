apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-speed-ingress
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.tls: "false"
spec:
  rules:
    - http:
        paths:
          - path: /speed
            pathType: Prefix
            backend:
              service:
                name: my-speed
                port:
                  number: 5216
