apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8s-data-pv
spec:
  capacity:
    storage: 10Ti
  volumeMode: Filesystem
  accessModes: [- ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.68.71
    path: /volume1/k8s-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8s-data-pvc
spec:
  accessModes: [- ReadWriteMany]
  storageClassName: ""
  resources:
    requests:
      storage: 10Ti